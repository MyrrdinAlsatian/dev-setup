# Example Custom Configuration

# This is an example configuration file showing all available options.
# Copy this to config/my-config.conf and customize as needed.

# Dotfiles Repository
# Your personal dotfiles repository URL
DOTFILES_REPO="https://github.com/yourusername/dotfiles.git"

# Tool Installation Flags
# Set to false to skip installation of specific tools
INSTALL_GIT=true
INSTALL_DOCKER=true
INSTALL_NVM=true
INSTALL_TMUX=true
INSTALL_STARSHIP=true
INSTALL_OPTIONAL_TOOLS=true

# Dotfiles Configuration
# Set to false to skip dotfiles setup
SETUP_DOTFILES=true

# Node.js Configuration
# Whether to install LTS version after installing NVM
INSTALL_NODE_LTS=true

# Git Configuration
# Pre-configure Git with your user information
# Leave empty to be prompted during installation
GIT_USER_NAME="Your Name"
GIT_USER_EMAIL="your.email@example.com"

# Package Manager Preferences (Linux only)
# Force a specific package manager (optional)
# FORCE_PACKAGE_MANAGER="apt"  # apt, dnf, yum, pacman, etc.

# Docker Configuration
# Whether to add current user to docker group (Linux only)
DOCKER_ADD_USER_TO_GROUP=true

# Verbose Output
# Set to true for more detailed output
VERBOSE=false
